<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:; base-uri 'none'; form-action 'none'">
<title>SnapSeal encoder &amp; decoder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#203831;font:17px/1.5 system-ui,sans-serif}main{max-width:720px;margin:40px auto;padding:24px}header{display:flex;align-items:center;gap:16px}header img{width:60px;height:60px}h1{font-size:clamp(25px,4vw,36px);line-height:1.2;margin:0}p{color:#4b6258}.panel{background:white;border:1px solid #cbd6ca;border-radius:16px;padding:24px;margin-top:24px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,button,a.download,textarea{font:inherit;border:1px solid #a6b7aa;border-radius:8px;padding:12px;max-width:100%}input:not([type=checkbox]),select,textarea{width:100%}button,a.download{cursor:pointer;display:inline-block;color:white;background:#245d45;text-decoration:none;min-height:48px}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.secondary{background:white;color:#245d45}#status{overflow-wrap:anywhere}#status[data-error=true]{color:#9f3026}.licenses{max-width:680px;margin:24px auto;padding:16px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}.toggle{display:flex;gap:10px;align-items:center;font-weight:400}.toggle input{width:20px;height:20px}small{color:#4b6258}a{color:#245d45}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}#language{width:auto;max-width:220px}@media(max-width:480px){main{margin:8px auto;padding:16px}.panel{padding:16px}.row{align-items:start;flex-direction:column}}
</style></head><body><main>
<header><img src="data:image/png;base64,<!--LOGO-->" alt="SnapSeal"><h1 id="heading"></h1></header><p id="intro"></p>
<div class="row"><a href="https://github.com/ShoGroupSpace/snapseal-codec" target="_blank" rel="noopener noreferrer">GitHub · snapseal-codec</a><label id="language-label" for="language"></label><select id="language"></select></div>
<section class="panel"><div class="actions"><button id="mode-unlock" type="button"></button><button id="mode-protect" class="secondary" type="button"></button></div>
<form id="form"><label id="file-label" for="input"></label><input id="input" type="file" required>
<div id="encode-options" hidden><label id="cover-label" for="cover"></label><input id="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><label id="delivery-label" for="recovery"></label><select id="recovery"><option value="auto"></option><option value="standard"></option><option value="hd"></option><option value="file"></option></select></div>
<label id="password-label" for="password"></label><input id="password" type="password" autocomplete="off" required maxlength="512"><label class="toggle"><input id="show" type="checkbox"><span id="show-label"></span></label>
<p><small id="recovery-hint"></small></p><div class="actions"><button id="submit" type="submit"></button><button id="clear" class="secondary" type="button"></button></div></form>
<p id="status" role="status" aria-live="polite"></p><div id="downloads" class="actions"></div></section>
</main><script><!--APP--></script></body></html>
